<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Now - Code CLA</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Header -->
        <header>
        <nav>
            <div class="logo">
                <img src="assets/logo.svg" alt="" class="title-logo">
                <a href="index.html">CodeCLA</a>
            </div>
            <div class="nav-cta">
                <!-- <a href="https://codecla.com/register">Register</a> -->
                <h2>Register</h2>
            </div>
        </nav>
    </header>
    <!-- Main content -->
    <main>
        <!-- authentication coontainer -->
     <section class="split-auth-container">
            <div class="auth-image-side">
                <img src="assets/coding.png" alt="Decorativ logo"  class="split-coding">
            </div>
        <div class="auth-data-side">
            <form action="#" method="post" class="auth-form">
                <div class="form-content-signup">
                <h2>Join Now</h2>
                </div>
                <div class="form-group">
                    <input type="text" name="firstname" id="firstname" placeholder="First Name">
                </div>
                <div class="form-group">
                    <input type="text" name="lastname" id="lastname" placeholder="Last Name">
                </div>
                <div class="form-group">
                    <input type="email" name="email" id="email" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <input type="password" name="password" id="password" minlength="8" placeholder="Password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <input type="password" name="password_confirm" id="password_confirm" minlength="8" placeholder="Confirm Password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary-join">Sign Up</button>
              <!-- link to signin page -->
                <div class="auth-account">
                <p>Already have an account? <a href="signin.html">Sign In</a></p>
                </div>
            </form>
        </div>
     </section>
    </main>
    <!-- Footer (consistent with page 1) -->
    <footer>
        <div class="footer">
            <p>&copy; 2026 CodeCLA. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
