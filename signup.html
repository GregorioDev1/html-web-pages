<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Code Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / navigation (consistent with page 1) -->
        <header>
        <nav>
            <div class="logo">
                <a href="index.html"><strong>Code Quest</strong></a>
            </div>
            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="testimonial.html">Testimonials</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
            <div class="nav-cta">
                <!-- <a href="https://codequest.com/register">Register</a> -->
                <h2>Register</h2>
                <a href="signin.html" class="btn-secondary">Sign In</a>
                <a href="signup.html" class="btn-primary">Sign Up</a>
            </div>
        </nav>
    </header>
    <!-- Main content -->
    <main>
        <!-- authentication coontainer -->
        <section class="auth-container">
            <div class="auth-header">
                <h2>Sign Up</h2>
            </div>
            <form action="#" method="post" class="auth-form">
                <div class="form-group">
                    <input type="text" name="firstname" id="firstname" placeholder="First Name">
                </div>
                <div class="form-group">
                    <input type="text" name="lastname" id="lastname" placeholder="Last Name">
                </div>
                <div class="form-group">
                    <input type="email" name="email" id="email" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <input type="password" name="password" id="password" minlength="8" placeholder="Password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <input type="password" name="password_confirm" id="password_confirm" minlength="8" placeholder="Confirm Password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>

            <!-- link to signin page -->
            <div class="auth-account">
                <p>Already have an account? <a href="signin.html">Sign In</a></p>
            </div>
        </form>
            <!-- team photo -->
             <div class=" team-section">
                <h2>Join and Learn together!</h2>
                <img src="assets/team.svg" alt="Code Quest Team" class="team-img">
             </div>

         </section>
    </main>
    <!-- Footer (consistent with page 1) -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Code Quest. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
