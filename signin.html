<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Code CLA</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
    <body>
    <!-- Header / navigation (consistent with page 1) -->
        <header>
        <nav>
            <div class="logo">
                <img src="assets/logo.svg" alt="" class="title-logo">
                <a href="index.html">CodeCLA</a>
            </div>
            <div class="nav-cta">
                <!-- <a href="https://codecla.com/register">Register</a> -->
            </div>
        </nav>
    </header>

    <!-- Main content -->
        <main>
            <!-- authentication coontainer -->
            <section class="split-auth-container">
                 <div class="auth-image-side">
                <img src="assets/coding.png" alt="Decorativ logo"  class="split-coding">
            </div>
            <div class="auth-data-side">
                <form action="signin.html" method="post" class="signin-form">
                    <div>
                        <h2>Welcome Back!</h2>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" id="email" placeholder="Email">
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password">
                        </div>
                        <button type="submit" class="btn-primary-login">Login</button>
                        <div class="auth-login">
                        <p>New to CodeCLA? <a href="signup.html">Create an Account</a></p>
                        </div>
                </form>
            </div>
            </section>
        </main>
        <!-- Footer -->
        <footer>
        <div class="footer">
            <p>&copy; Your Considerate Programming Platform. All rights reserved.</p>
        </div>
    </footer>
    </body>
</html>
