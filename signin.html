<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Code Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
    <!-- Header / navigation (consistent with page 1) -->
        <header>
        <nav>
            <div class="logo">
                <a href="index.html"><strong>Code Quest</strong></a>
            </div>
            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="testimonial.html">Testimonials</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
            <div class="nav-cta">
                <!-- <a href="https://codequest.com/register">Register</a> -->
                <h2>Register</h2>
                <a href="signin.html" class="btn-secondary">Sign In</a>
                <a href="signup.html" class="btn-primary">Sign Up</a>
            </div>
        </nav>
    </header>

    <!-- Main content -->
        <main>
            <!-- authentication coontainer -->
            <section class="auth-container">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                </div>
                <!-- sign in form -->
                    <form action="signin.html" method="post" class="signin-form">
                        <div class="form-group">
                            <input type="email" name="email" id="email" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Enter your password">
                        </div>
                        <button type="submit" class="btn-primary">Sign In</button>
                    </form>
                    <!-- link to signup page -->
                    <div class="auth-footer">
                        <p>New to Code Quest, Don't have an account? <a href="signup.html">Create an Account</a></p>
                    </div>
            </section>
        </main>

        <!-- Image -->
        <section class="auth-banner">
            <img src="assets/coding.png" alt="developer writing code" class="coding-img">
        </section>

        <!-- Footer (consistent with page 1) -->
        <footer>
             <p>&copy; 2026 Code Quest. All rights reserved.</p>
        </footer>
    </body>
</html>
